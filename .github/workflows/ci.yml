name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pytest
          pip install -e ../../packages/a2a-sdk
      - name: Hermetic tests
        run: >
          pytest -q
          tests/test_preflight.py
          tests/test_api_routers.py
          tests/test_quota.py
          tests/test_dag.py
          tests/test_workflows.py
          tests/test_execution_state_machine.py
          tests/test_visual_runtime.py
          tests/test_error_handling.py
          tests/test_approval.py
          tests/test_artifact_package.py
          tests/test_golden_demo.py

  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ../llm-provider
          pip install -e ".[dev]"
      - name: Harness adapter tests
        run: pytest -q tests/test_harness_adapter.py tests/test_harness_approvals.py

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go test ./internal/auth/ ./internal/httpapi/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Golden-path smoke
        run: npm run smoke
