# Prometheus scrape config when apps run on the host (infra-only compose).
# Requires prometheus.extra_hosts: host.docker.internal:host-gateway

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aop'
    environment: 'host-dev'

scrape_configs:
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['host.docker.internal:8090']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'orchestrator-prom-client'
    static_configs:
      - targets: ['host.docker.internal:9091']
    scrape_interval: 30s
    scrape_timeout: 5s

  - job_name: 'orchestrator-legacy'
    static_configs:
      - targets: ['host.docker.internal:8090']
    metrics_path: '/v1/metrics'
    params:
      format: ['prometheus']
    scrape_interval: 30s

  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'worker'
    static_configs:
      - targets: ['host.docker.internal:9092']
        labels:
          instance: 'worker'
    scrape_interval: 30s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

rule_files:
  - "alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
