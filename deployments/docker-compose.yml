services:
  postgres:
    image: postgres:16-alpine
    container_name: aop-postgres
    environment:
      POSTGRES_USER: aop
      POSTGRES_PASSWORD: aop
      POSTGRES_DB: aop
    ports:
      - "5432:5432"
    volumes:
      - aop_pg_data:/var/lib/postgresql/data
      - ../infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aop -d aop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aop-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aop_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: aop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aopminio
      MINIO_ROOT_PASSWORD: aopminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aop_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: aop-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 aopminio aopminio123;
      mc mb -p local/aop-artifacts || true;
      mc anonymous set download local/aop-artifacts || true;
      exit 0;
      "

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: aop-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Apps typically run on the host with this compose file (infra-only)
      - ./prometheus/prometheus.host.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - aop_prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aop-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - aop_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: aop-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - aop_alertmanager_data:/alertmanager
    depends_on:
      - prometheus
    restart: unless-stopped

  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    container_name: aop-webhook
    ports:
      - "5000:5000"
    depends_on:
      - alertmanager
    restart: unless-stopped

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aop-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    volumes:
      - aop_jaeger_data:/tmp
    restart: unless-stopped

  search-agent:
    build:
      context: ../agents/search-agent
      dockerfile: Dockerfile
    container_name: aop-search-agent
    environment:
      AGENT_URL: http://search-agent:8001/
      PORT: "8001"
      DEERFLOW_URL: ${DEERFLOW_URL:-http://deerflow:8000}
      SEARCH_MODE: ${SEARCH_MODE:-auto}
      DEERFLOW_TIMEOUT: ${DEERFLOW_TIMEOUT:-300}
    ports:
      - "8001:8001"
    depends_on:
      - deerflow
    profiles:
      - agents

  # DeerFlow deep-research backend (https://github.com/bytedance/deer-flow main-1.x)
  # Clone once: git clone --depth 1 --branch main-1.x https://github.com/bytedance/deer-flow.git third_party/deer-flow
  # Then copy deployments/deerflow/{.env,conf.yaml}.example → .env / conf.yaml and fill LLM + search keys.
  deerflow:
    build:
      context: ../third_party/deer-flow
      dockerfile: Dockerfile
    container_name: aop-deerflow
    ports:
      - "8020:8000"
    env_file:
      - ./deerflow/.env
    environment:
      # Resolved by conf.yaml $OPENAI_* placeholders (do not bake secrets into the image)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      SEARCH_API: ${SEARCH_API:-duckduckgo}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:8001,http://search-agent:8001
    volumes:
      - ./deerflow/conf.yaml:/app/conf.yaml:ro
    # Image builds as root then switches to appuser; `uv run` tries to rewrite .venv → Permission denied.
    # Call the venv interpreter directly so startup does not re-sync packages.
    user: "0:0"
    command: ["/app/.venv/bin/python", "server.py", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    profiles:
      - deerflow
      - agents

  # DeepPresenter / PPTAgent v1.1.38 (https://github.com/icip-cas/PPTAgent/tree/v1.1.38)
  # Clone once: git clone --depth 1 --branch v1.1.38 https://github.com/icip-cas/PPTAgent.git third_party/PPTAgent
  # Pull images: docker pull forceless/deeppresenter-host && docker tag forceless/deeppresenter-host deeppresenter-host
  #              docker pull forceless/deeppresenter-sandbox && docker tag forceless/deeppresenter-sandbox deeppresenter-sandbox
  # Copy deployments/pptagent/config.yaml.example → config.yaml and fill LLM keys.
  deeppresenter:
    image: deeppresenter-host
    container_name: aop-deeppresenter
    ports:
      - "8021:7861"
    environment:
      DEEPPRESENTER_HOST_WORKSPACE_BASE: /opt/workspace
      DEEPPRESENTER_WORKSPACE_BASE: /opt/workspace
      DEEPPRESENTER_LOG_LEVEL: "10"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
    volumes:
      - ./pptagent/workspace:/opt/workspace
      - ./pptagent/config.yaml:/usr/src/pptagent/deeppresenter/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    profiles:
      - pptagent
      - agents

  ppt-agent:
    build:
      context: ../agents/ppt-agent
    container_name: aop-ppt-agent
    environment:
      AGENT_URL: http://ppt-agent:8009/
      PORT: "8009"
      PPT_MODE: ${PPT_MODE:-auto}
      PPTAGENT_CONTAINER: aop-deeppresenter
      PPTAGENT_TIMEOUT: ${PPTAGENT_TIMEOUT:-600}
    ports:
      - "8009:8009"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - deeppresenter
    profiles:
      - agents

volumes:
  aop_pg_data:
  aop_redis_data:
  aop_minio_data:
  aop_prometheus_data:
  aop_grafana_data:
  aop_alertmanager_data:
  aop_jaeger_data:
