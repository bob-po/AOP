id = "hermes"
version = "0.1.0"
kind = "agent"
command = "python"
args = ["-u", "../_harness/run_profile.py"]
workdir = "."
health_url = "http://127.0.0.1:8015/health"
description = "Hermes harness agent (aop-node plugin → agents/harness-agent)"

[env]
PORT = "8015"
AGENT_URL = "http://127.0.0.1:8015/"
HARNESS_PROFILE = "hermes"
AGENT_ID = "hermes"
AOP_NODE_MANAGED = "1"
HARNESS_HEARTBEAT = "0"
HARNESS_RUNNER = "hermes"
# Resolve hermes via PATH, or set HERMES_CLI_PATH in aop-node.toml / user env.
