id = "claude-code"
version = "0.1.0"
kind = "agent"
command = "python"
args = ["-u", "run.py"]
workdir = "."
health_url = "http://127.0.0.1:8011/health"
description = "Claude Code harness agent (aop-node plugin → agents/harness-agent)"

[env]
PORT = "8011"
AGENT_URL = "http://127.0.0.1:8011/"
HARNESS_PROFILE = "claude-code"
AGENT_ID = "claude-code"
HARNESS_HEARTBEAT = "1"
HARNESS_RUNNER = "claude_cli"
