id = "openclaw"
version = "0.1.0"
kind = "agent"
command = "python"
args = ["-u", "run.py"]
workdir = "."
health_url = "http://127.0.0.1:8014/health"
description = "OpenClaw harness agent (aop-node plugin → agents/harness-agent)"

[env]
PORT = "8014"
AGENT_URL = "http://127.0.0.1:8014/"
HARNESS_PROFILE = "openclaw"
AGENT_ID = "openclaw"
HARNESS_HEARTBEAT = "1"
HARNESS_RUNNER = "openclaw"
# Absolute path so aopd children find the CLI even if PATH is incomplete.
OPENCLAW_CLI_PATH = "C:\\Users\\guojiayang\\AppData\\Roaming\\npm\\openclaw.cmd"
