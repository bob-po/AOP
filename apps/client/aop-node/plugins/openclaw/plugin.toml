id = "openclaw"
version = "0.1.0"
kind = "agent"
command = "python"
args = ["-u", "../_harness/run_profile.py"]
workdir = "."
health_url = "http://127.0.0.1:8014/health"
description = "OpenClaw harness agent (aop-node plugin → agents/harness-agent)"

[env]
PORT = "8014"
AGENT_URL = "http://127.0.0.1:8014/"
HARNESS_PROFILE = "openclaw"
AGENT_ID = "openclaw"
AOP_NODE_MANAGED = "1"
HARNESS_HEARTBEAT = "0"
HARNESS_RUNNER = "openclaw"
# Resolve openclaw via PATH, or set OPENCLAW_CLI_PATH in aop-node.toml / user env.
