id = "pi"
version = "local"
kind = "agent"
command = "python"
args = ["-m", "uvicorn", "agent:app", "--host", "127.0.0.1", "--port", "8013"]
workdir = "../../../../../agents/harness-agent"
health_url = "http://127.0.0.1:8013/health"
description = "Pi harness agent"

[env]
PORT = "8013"
AGENT_URL = "http://127.0.0.1:8013/"
HARNESS_PROFILE = "pi"
AGENT_ID = "pi"
HARNESS_HEARTBEAT = "1"
