id = "pi"
version = "0.1.0"
kind = "agent"
command = "python"
args = ["-u", "run.py"]
workdir = "."
health_url = "http://127.0.0.1:8013/health"
description = "Pi harness agent (aop-node plugin → agents/harness-agent)"

[env]
PORT = "8013"
AGENT_URL = "http://127.0.0.1:8013/"
HARNESS_PROFILE = "pi"
AGENT_ID = "pi"
HARNESS_HEARTBEAT = "1"
HARNESS_RUNNER = "pi_cli"
