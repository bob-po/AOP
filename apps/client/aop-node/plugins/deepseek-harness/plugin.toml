id = "deepseek-harness"
version = "0.1.0"
kind = "agent"
command = "python"
args = ["-u", "../_harness/run_profile.py"]
workdir = "."
health_url = "http://127.0.0.1:8012/health"
description = "DeepSeek Harness agent (aop-node plugin → agents/harness-agent)"

[env]
PORT = "8012"
AGENT_URL = "http://127.0.0.1:8012/"
HARNESS_PROFILE = "deepseek-harness"
AGENT_ID = "deepseek-harness"
AOP_NODE_MANAGED = "1"
HARNESS_HEARTBEAT = "0"
HARNESS_RUNNER = "deepseek"
