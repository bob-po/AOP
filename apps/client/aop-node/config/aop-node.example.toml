[whitelist]
allowed_binaries = [
  "python",
  "python3",
  "openclaw",
  "hermes",
  "pi",
  "claude",
  "cmd",
  "sh",
]
allowed_plugin_ids = [
  "claude-code",
  "deepseek-harness",
  "pi",
  "openclaw",
  "hermes",
  "echo",
]
allowed_path_prefixes = []
