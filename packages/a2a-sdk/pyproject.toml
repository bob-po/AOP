[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aop-a2a-sdk"
version = "0.2.0"
description = "AOP A2A SDK with streaming, cancellation, and delegation support"
authors = [
    {name = "AOP Team", email = "team@aop.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.14",
    "httpx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["a2a_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]