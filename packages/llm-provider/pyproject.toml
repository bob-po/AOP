[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aop-llm-provider"
version = "0.1.0"
description = "Unified LLM Provider for AOP Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_provider*"]
